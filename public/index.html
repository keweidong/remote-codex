<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#171719" />
    <title>Codex Pocket · 手机会话</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="phone-page">
    <!-- Lucide icon data. License notices: docs/licenses/lucide.txt. -->
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-definitions" aria-hidden="true">
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
      <symbol id="icon-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
      <symbol id="icon-continue" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="icon-panel" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="icon-stop" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
    </svg>
    <section id="pair-screen" class="pair-screen hidden">
      <div class="brand-mark">C<span>↗</span></div>
      <p class="eyebrow">CODEX POCKET</p>
      <h1 id="pair-title">连接你的 Codex</h1>
      <p id="pair-description" class="muted">
        在电脑管理页生成二维码，用手机扫码后确认配对。
      </p>
      <form id="pair-form" class="hidden">
        <label for="device-name">这台设备叫什么？</label
        ><input
          id="device-name"
          maxlength="60"
          value="我的手机"
          autocomplete="off"
        /><button class="primary" type="submit">确认配对</button>
      </form>
      <p id="pair-error" class="error-text" role="alert"></p>
      <p class="small muted">
        配对后可以查看、继续和新建会话，并对支持控制的执行中轮次插话或停止。授权可随时在电脑管理页撤销。
      </p>
    </section>
    <div id="workspace" class="workspace sidebar-open hidden">
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭侧栏" tabindex="-1"></button>
      <aside id="chat-sidebar" class="chat-sidebar" aria-label="项目和会话">
        <header class="sidebar-heading">
          <span class="online-dot" aria-hidden="true"></span>
          <h1>Codex Pocket</h1>
          <div class="sidebar-actions">
            <button id="refresh-list" class="icon-button" type="button" title="刷新会话" aria-label="刷新会话"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg></button>
            <button id="new-thread" class="icon-button" type="button" title="新建会话" aria-label="新建会话" disabled><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></button>
            <button id="sidebar-close" class="icon-button" type="button" title="隐藏侧栏" aria-label="隐藏侧栏"><svg class="icon" aria-hidden="true"><use href="#icon-panel"/></svg></button>
          </div>
        </header>
        <div class="filters">
          <label class="sr-only" for="search">搜索聊天</label
          ><input
            id="search"
            type="search"
            placeholder="搜索会话或项目…"
            autocomplete="off"
          />
        </div>
        <div class="list-label">
          <span>项目</span>
          <span id="thread-count"></span>
        </div>
        <div id="thread-list" class="thread-list"></div>
        <footer class="sidebar-footer">
          <span class="online-dot" aria-hidden="true"></span><span id="device-label">已连接</span>
          <button id="logout" class="icon-button" type="button" title="取消本设备配对" aria-label="取消本设备配对"><svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg></button>
        </footer>
      </aside>
      <main id="conversation" class="conversation">
          <header class="conversation-heading">
            <button id="sidebar-toggle" class="icon-button" aria-label="隐藏侧栏" aria-controls="chat-sidebar" aria-expanded="true" title="隐藏侧栏" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-panel"/></svg>
            </button>
            <div class="conversation-title">
              <strong id="thread-title">Codex Pocket</strong>
              <div id="thread-meta" class="small muted"></div>
            </div>
            <span id="thread-status" class="status"></span>
            <button id="interrupt-turn" class="icon-button hidden" type="button" title="停止当前轮次" aria-label="停止当前轮次" disabled><svg class="icon" aria-hidden="true"><use href="#icon-stop"/></svg></button>
          </header>
        <div id="empty-chat" class="empty-chat">
          <h2>Codex Pocket</h2>
          <p class="muted">选择一个会话</p>
        </div>
        <div id="chat-content" class="chat-content hidden">
          <div id="queue-status" class="queue-status hidden" aria-label="待执行队列" aria-busy="false">
            <div class="queue-status-row">
              <span id="queue-summary" role="status"></span>
              <button id="resume-queue" class="text-button queue-resume" type="button" aria-describedby="queue-reason" disabled><svg class="icon" aria-hidden="true"><use href="#icon-continue"/></svg><span id="queue-resume-label">恢复队列</span></button>
            </div>
            <p id="queue-reason" role="status"></p>
          </div>
          <div id="messages-scroll" class="messages-scroll">
            <button id="load-earlier" class="text-button hidden">
              加载更早的消息
            </button>
            <div id="messages" class="messages"></div>
            <div id="activity" class="activity hidden"></div>
          </div>
          <div class="composer-area">
            <p id="chat-notice" class="notice small" role="status"></p>
            <form id="composer">
              <div class="composer-toolbar">
              <div class="compose-modes" role="group" aria-label="发送方式">
                <button id="queue-mode" type="button" aria-pressed="true" title="加入消息队列">排队</button>
                <button id="steer-mode" type="button" aria-pressed="false" title="正在读取本轮控制状态" disabled>插话</button>
              </div>
              <details id="chat-settings" class="chat-settings">
                <summary title="模型与推理强度"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span id="model-summary">沿用会话设置</span></summary>
                <div class="model-settings">
                <label for="model-select">模型<select id="model-select" disabled><option value="">沿用会话 / 默认模型</option></select></label>
                <label for="effort-select">推理强度<select id="effort-select" disabled><option value="">沿用会话 / 默认强度</option></select></label>
                </div>
                <p id="model-notice" class="notice small" role="status">正在读取模型列表…</p>
              </details>
              </div>
              <div class="composer-row">
              <label class="sr-only" for="message-input">给 Codex 的消息</label
              ><textarea
                id="message-input"
                rows="1"
                maxlength="12000"
                placeholder="给这个会话发消息…"
              ></textarea>
              <div class="composer-actions">
                <button id="continue" type="button" class="icon-button" title="发送“继续”消息" aria-label="发送“继续”消息"><svg class="icon" aria-hidden="true"><use href="#icon-continue"/></svg></button>
                <button id="send" type="submit" class="primary icon-button" title="发送消息" aria-label="发送消息"><svg class="icon" aria-hidden="true"><use href="#icon-send"/></svg></button>
              </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <dialog id="new-thread-dialog" class="new-thread-dialog" aria-labelledby="new-thread-title" aria-describedby="new-thread-description">
      <form id="new-thread-form">
        <p class="eyebrow">CODEX POCKET</p>
        <h2 id="new-thread-title">新建会话</h2>
        <p id="new-thread-description" class="muted small">选择电脑上的项目，发送首条消息开始任务。</p>
        <label for="new-project">项目</label>
        <select id="new-project" required></select>
        <div class="model-settings">
          <label for="new-model">模型<select id="new-model" disabled><option value="">使用默认模型</option></select></label>
          <label for="new-effort">推理强度<select id="new-effort" disabled><option value="">使用默认强度</option></select></label>
        </div>
        <p id="new-model-notice" class="notice small" role="status">正在读取模型列表…</p>
        <label for="new-message">首条消息</label>
        <textarea id="new-message" rows="5" maxlength="12000" placeholder="想让 Codex 帮你做什么？" required></textarea>
        <p id="new-thread-error" class="error-text small" role="alert"></p>
        <div class="new-thread-actions">
          <button id="cancel-new-thread" class="secondary" type="button">取消</button>
          <button id="create-thread" class="primary" type="submit">创建并发送</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
